name: KOMPAS smoke test

on:
  push:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      show_task_window:
        description: 'Open CAD Assist WPF task window on the runner desktop'
        required: false
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'

jobs:
  kompas-smoke:
    name: Build and run on KOMPAS workstation
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 20
    env:
      KOMPAS_TEST_MODEL_PATH: 'C:\cad-assist-test\test.m3d'
      CAD_ASSIST_TEST_TASK: 'Проверить отверстия под крепёж'
      DOTNET_SYSTEM_CONSOLE_ALLOW_ANSI_COLOR_REDIRECTION: 'true'
      CAD_ASSIST_APP_DIR: 'C:\cad-assist-test\app'
      CAD_ASSIST_ADDIN_DIR: 'C:\cad-assist-test\addin'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Build KOMPAS interop project
        shell: powershell
        run: |
          chcp 65001 | Out-Null
          [Console]::OutputEncoding = [System.Text.UTF8Encoding]::new($false)
          $OutputEncoding = [System.Text.UTF8Encoding]::new($false)
          dotnet restore src/CadAssist.Kompas.Interop/CadAssist.Kompas.Interop.csproj
          dotnet build src/CadAssist.Kompas.Interop/CadAssist.Kompas.Interop.csproj -c Release --no-restore
          New-Item -ItemType Directory -Force -Path "$env:CAD_ASSIST_APP_DIR" | Out-Null
          dotnet publish src/CadAssist.Kompas.Interop/CadAssist.Kompas.Interop.csproj -c Release -o "$env:CAD_ASSIST_APP_DIR" --no-restore
          Write-Host "CAD Assist app published to $env:CAD_ASSIST_APP_DIR"

      - name: Build managed KOMPAS addin DLL
        shell: powershell
        run: |
          chcp 65001 | Out-Null
          [Console]::OutputEncoding = [System.Text.UTF8Encoding]::new($false)
          $OutputEncoding = [System.Text.UTF8Encoding]::new($false)
          New-Item -ItemType Directory -Force -Path "$env:CAD_ASSIST_ADDIN_DIR" | Out-Null
          dotnet restore src/CadAssist.Kompas.Addin/CadAssist.Kompas.Addin.csproj
          dotnet build src/CadAssist.Kompas.Addin/CadAssist.Kompas.Addin.csproj -c Release --no-restore
          Copy-Item src/CadAssist.Kompas.Addin/bin/Release/net48/CadAssist.Kompas.Addin.dll "$env:CAD_ASSIST_ADDIN_DIR\CadAssist.Kompas.Addin.dll" -Force
          Write-Host "CAD Assist managed addin DLL published to $env:CAD_ASSIST_ADDIN_DIR"

      - name: Build native KOMPAS addin shim DLL
        shell: powershell
        run: |
          chcp 65001 | Out-Null
          [Console]::OutputEncoding = [System.Text.UTF8Encoding]::new($false)
          $OutputEncoding = [System.Text.UTF8Encoding]::new($false)
          New-Item -ItemType Directory -Force -Path "$env:CAD_ASSIST_ADDIN_DIR" | Out-Null
          $msbuildCandidates = @(
            "${env:ProgramFiles}\Microsoft Visual Studio\2022\BuildTools\MSBuild\Current\Bin\MSBuild.exe",
            "${env:ProgramFiles}\Microsoft Visual Studio\2022\Community\MSBuild\Current\Bin\MSBuild.exe",
            "${env:ProgramFiles}\Microsoft Visual Studio\2022\Professional\MSBuild\Current\Bin\MSBuild.exe",
            "${env:ProgramFiles}\Microsoft Visual Studio\2022\Enterprise\MSBuild\Current\Bin\MSBuild.exe"
          )
          $msbuild = $msbuildCandidates | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $msbuild) {
            Write-Host "MSBuild.exe was not found. Install Visual Studio Build Tools 2022 with Desktop development with C++."
            exit 1
          }
          Write-Host "Using MSBuild: $msbuild"
          & $msbuild src/CadAssist.Kompas.NativeAddin/CadAssist.Kompas.NativeAddin.vcxproj /p:Configuration=Release /p:Platform=x64 /m
          if ($LASTEXITCODE -ne 0) {
            Write-Host "Native addin build failed."
            exit $LASTEXITCODE
          }
          $nativeDll = Get-ChildItem -Path src/CadAssist.Kompas.NativeAddin -Recurse -Filter CadAssist.Kompas.NativeAddin.dll -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $nativeDll) {
            $nativeDll = Get-ChildItem -Path . -Recurse -Filter CadAssist.Kompas.NativeAddin.dll -ErrorAction SilentlyContinue | Select-Object -First 1
          }
          if (-not $nativeDll) {
            Write-Host "Native addin DLL was not found after build."
            exit 1
          }
          Copy-Item $nativeDll.FullName "$env:CAD_ASSIST_ADDIN_DIR\CadAssist.Kompas.NativeAddin.dll" -Force
          Write-Host "CAD Assist native addin DLL published to $env:CAD_ASSIST_ADDIN_DIR"

      - name: Run KOMPAS integration smoke test
        shell: powershell
        run: |
          $ErrorActionPreference = 'Continue'
          chcp 65001 | Out-Null
          [Console]::OutputEncoding = [System.Text.UTF8Encoding]::new($false)
          $OutputEncoding = [System.Text.UTF8Encoding]::new($false)
          New-Item -ItemType Directory -Force -Path artifacts | Out-Null
          $showTaskWindow = '${{ github.event.inputs.show_task_window }}'
          $taskWindowArg = ''
          if ($showTaskWindow -eq 'true') {
            $taskWindowArg = '--show-task-window'
            Write-Host 'CAD Assist WPF task window mode is enabled.'
          } else {
            Write-Host 'CAD Assist WPF task window mode is disabled.'
          }
          $appExe = Join-Path $env:CAD_ASSIST_APP_DIR 'CadAssist.Kompas.Interop.exe'
          if (-not (Test-Path $appExe)) {
            Write-Host "CAD Assist app executable was not found: $appExe"
            exit 1
          }
          & $appExe --smoke-test --model-path "$env:KOMPAS_TEST_MODEL_PATH" --add-task "$env:CAD_ASSIST_TEST_TASK" $taskWindowArg --json-log artifacts/kompas-smoke.json *> artifacts/kompas-smoke.log
          $exitCode = $LASTEXITCODE
          Get-Content -Encoding UTF8 artifacts/kompas-smoke.log
          if ($exitCode -ne 0) {
            Write-Host "KOMPAS smoke test failed with exit code $exitCode"
            exit $exitCode
          }

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kompas-smoke-diagnostics
          path: artifacts/
